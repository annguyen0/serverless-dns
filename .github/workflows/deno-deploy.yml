name: 🦕 Deno Deploy

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/deno-deploy.yml"
      - ".env.example"
      - ".eslintrc.cjs"
      - ".prettierignore"
      - "README.md"
      - "wrangler.toml"
      - "fly.toml"
      - "node.Dockerfile"
      - "deno.Dockerfile"
      - ".vscode/*"
      - ".husky/*"
      - ".prettierrc.json"
      - "LICENSE"
      - "run"
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git branch / tag / commit to deploy'
        required: false
        default: 'main'

jobs:
  deploy:
    name: 🦕 Deno Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # needed to authenticate with deno.com via OIDC (id-token); fall back to
      # the DENO_DEPLOY_TOKEN secret if OIDC is not enabled.
      id-token: write
      # needed to clone repo
      contents: read
    steps:
      - name: 🚚 Fetch code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.git-ref || github.ref }}
          fetch-depth: 0

      - name: 🦕 Install Deno@2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      # Fetch the latest blocklist basicconfig/filetag into src/ (cfg.js
      # imports them at module-load). These files are gitignored, so they are
      # generated on-demand during CI, and again by the `deploy.build` step in
      # deno.json on the Deno Deploy build machines (which lack `wget`).
      - name: 📦 Fetch blocklist config
        run: |
          echo "::notice::generating src/u6-basicconfig.json & src/u6-filetag.json"
          deno task prepare-deno

      - name: 🩺 Type-check
        run: deno check --allow-import --import-map import_map.json src/server-deno.ts

      - name: 🤸 Deploy to Deno Deploy
        # `deno deploy` (no subcommand) uploads the current directory and
        # builds + routes it according to the `deploy` block in deno.json.
        # org/app/token are read from DENO_DEPLOY_* env vars, which avoids the
        # `--org`/`--app`/`--prod` flags (these currently trip an upstream
        # duplicate-option bug in the bundled @deno/deploy CLI).
        #
        # Production routing: rather than relying on `--prod` (blocked by the
        # same upstream bug), link this repository in the Deno Deploy dashboard
        # (console.deno.com) so the default-branch build is routed to the app's
        # Production timeline automatically. `--prod` can be added back here
        # once denoland/deploy resolves the duplicate-option issue.
        run: |
          deno deploy
        env:
          # Either set a fine-grained DENO_DEPLOY_TOKEN secret, or enable OIDC
          # on the Deno Deploy / GitHub integration (permissions.id-token above).
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          # Org/app may also be persisted in the dashboard's app config. When
          # unset here, the CLI falls back to interactive selection (not
          # possible in CI), so set DENO_DEPLOY_ORG / DENO_DEPLOY_APP secrets.
          DENO_DEPLOY_ORG: ${{ secrets.DENO_ORG }}
          DENO_DEPLOY_APP: ${{ secrets.DENO_DEPLOY_APP || secrets.DENO_PROJECT_NAME || 'rdns' }}
