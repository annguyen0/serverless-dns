name: 🦕 Deno Deploy

on:
  push:
    branches:
      - "main"
    paths-ignore:
      - ".github/**"
      - "!.github/workflows/deno-deploy.yml"
      - ".env.example"
      - ".eslintrc.cjs"
      - ".prettierignore"
      - "README.md"
      - "wrangler.toml"
      - "fly.toml"
      - "node.Dockerfile"
      - "deno.Dockerfile"
      - ".vscode/*"
      - ".husky/*"
      - ".prettierrc.json"
      - "LICENSE"
      - "run"
  workflow_dispatch:
    inputs:
      git-ref:
        description: 'Git branch / tag / commit to deploy'
        required: false
        default: 'main'

jobs:
  deploy:
    name: 🦕 Deno Deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # needed to authenticate with deno.com via OIDC (id-token); fall back to
      # the DENO_DEPLOY_TOKEN secret if OIDC is not enabled.
      id-token: write
      # needed to clone repo
      contents: read
    steps:
      - name: 🚚 Fetch code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.git-ref || github.ref }}
          fetch-depth: 0

      - name: 🦕 Install Deno@2.x
        uses: denoland/setup-deno@v2
        with:
          deno-version: 2.x

      # Fetch the latest blocklist basicconfig/filetag into src/ (cfg.js
      # imports them at module-load). These files are gitignored, so they are
      # generated on-demand during CI, and again by the `deploy.build` step in
      # deno.json on the Deno Deploy build machines (which lack `wget`).
      - name: 📦 Fetch blocklist config
        run: |
          echo "::notice::generating src/u6-basicconfig.json & src/u6-filetag.json"
          deno task prepare-deno

      - name: 🩺 Type-check
        run: deno check --allow-import --import-map import_map.json src/server-deno.ts

      - name: 🤸 Deploy to Deno Deploy
        # `deno deploy` (no subcommand) uploads the current directory and
        # builds + routes it according to the `deploy` block in deno.json.
        #
        # deno.json's `deploy` object is validated against a strict schema in
        # which `org` is REQUIRED. The DENO_DEPLOY_ORG / DENO_DEPLOY_APP env
        # vars only feed the CLI's org/app *resolution*; on their own they do
        # NOT satisfy this schema parse, which otherwise fails with:
        #   Failed to parse "deploy" configuration: missing field `org`
        # (Passing --org/--app has the same problem.) So inject `org` (and the
        # optional `app`) into the config from the environment, keeping them
        # out of the committed repo. The existing `build`/`runtime` keys are
        # valid and are preserved; they configure the Deno Deploy build machine.
        #
        # Production routing: rather than relying on `--prod` (currently
        # tripped by an upstream duplicate-option bug in the bundled
        # @deno/deploy CLI), link this repository in the Deno Deploy dashboard
        # (console.deno.com) so the default-branch build is routed to the app's
        # Production timeline automatically. `--prod` can be added back once
        # denoland/deploy resolves the duplicate-option issue.
        run: |
          deno eval --no-config '
          const path = "deno.json";
          const cfg = JSON.parse(Deno.readTextFileSync(path));
          const org = Deno.env.get("DENO_DEPLOY_ORG");
          const app = Deno.env.get("DENO_DEPLOY_APP");
          if (!org) {
            console.error("DENO_DEPLOY_ORG is empty; set the DENO_ORG repository secret.");
            Deno.exit(1);
          }
          cfg.deploy = { ...(cfg.deploy ?? {}), org };
          if (app) cfg.deploy.app = app;
          Deno.writeTextFileSync(path, JSON.stringify(cfg, null, 2) + "\n");
          '
          deno deploy
        env:
          # Either set a fine-grained DENO_DEPLOY_TOKEN secret, or enable OIDC
          # on the Deno Deploy / GitHub integration (permissions.id-token above).
          DENO_DEPLOY_TOKEN: ${{ secrets.DENO_DEPLOY_TOKEN }}
          # DENO_DEPLOY_ORG is required: it is written into deno.json's `deploy`
          # block above, because the schema rejects a missing `org`.
          # DENO_DEPLOY_APP is optional (it defaults to the app named in the
          # dashboard). Both are also read back by the CLI for org/app
          # resolution, so they must be set (the CLI cannot prompt in CI).
          DENO_DEPLOY_ORG: ${{ secrets.DENO_ORG }}
          DENO_DEPLOY_APP: ${{ secrets.DENO_DEPLOY_APP || secrets.DENO_PROJECT_NAME || 'rdns' }}
